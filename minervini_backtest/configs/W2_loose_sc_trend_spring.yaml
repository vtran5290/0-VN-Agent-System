# W2_loose_sc_trend + require Spring (chỉ vào khi đã có bear trap)
name: W2_loose_sc_trend_spring
description: "Loose SC + TT + require_spring, JAC or LPS."
logic_gate: Sequential_Event_Validation
setup: wyckoff
wyckoff_trend_filter: true
require_spring: true
trigger_jac_ok: true
sc_vol_mult: 2.5
sc_spread_atr_mult: 1.8

constraints:
  min_tr_duration: 25
  max_tr_volatility: 0.24

stop_pct: 0.04
atr_k: 1.8
risk_pct: 0.006

exits:
  hard_stop: true
  trend_break_ma: 50
  fail_fast_days: 3
  climax_proxy: true

fee_bps: 20
slippage_bps: 5
min_hold_bars: 0
warmup_bars: 300
