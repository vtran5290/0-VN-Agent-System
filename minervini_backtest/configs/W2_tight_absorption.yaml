# TR hẹp (15%), Spring bắt buộc, LPS volume cực thấp (35%), stop chặt
name: W2_tight_absorption
description: "Wyckoff: tight TR 15%, Spring required, ultra-low vol LPS 35%."
logic_gate: Sequential_Event_Validation
setup: wyckoff
require_st: true
require_spring: true
trigger_jac_ok: false
sc_vol_mult: 2.5
lps_vol_max_ratio: 0.35

constraints:
  min_tr_duration: 35
  max_tr_volatility: 0.15

stop_pct: 0.04
atr_k: 1.5
risk_pct: 0.006

exits:
  hard_stop: true
  trend_break_ma: 50
  fail_fast_days: 3
  climax_proxy: true

fee_bps: 20
slippage_bps: 5
min_hold_bars: 0
warmup_bars: 300
