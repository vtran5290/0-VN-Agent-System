# Tighter absorption: 2 ultra-dry days, tighter closes, stronger JAC
name: W2_tight_dry_sos2
description: "TT Lite + tighter base + >=2 ultra-dry days + stronger JAC."
logic_gate: Sequential_Event_Validation
setup: wyckoff
wyckoff_trend_filter: true
trigger_jac_ok: true
sc_vol_mult: 2.5
sc_spread_atr_mult: 1.8
tight_close_window: 12
base_max_close_range_pct: 0.04
base_max_close_stdev_pct: 0.01
ultra_dry_vol_ratio: 0.45
require_ultra_dry_days: 2
require_tight_base: true
require_sos: true
sos_lookback: 12
sos_vol_mult: 1.25
sos_spread_atr_mult: 1.15
min_sos_bars: 1
jac_vol_mult: 1.45
jac_breakout_pct: 0.003
jac_close_pos_min: 0.75
constraints:
  min_tr_duration: 22
  max_tr_volatility: 0.20
stop_pct: 0.04
atr_k: 1.7
risk_pct: 0.006
exits:
  hard_stop: true
  trend_break_ma: 50
  fail_fast_days: 3
  climax_proxy: true
fee_bps: 20
slippage_bps: 5
min_hold_bars: 0
warmup_bars: 300
