# W2 tuned for VN: looser TR duration, JAC or LPS trigger for more signals
name: W2_tuned
description: "Wyckoff VN tuned: min_tr 15, JAC or LPS trigger, stop 5%."
logic_gate: Sequential_Event_Validation
setup: wyckoff
trigger_jac_ok: true

constraints:
  min_tr_duration: 15
  max_tr_volatility: 0.25

stop_pct: 0.05
atr_k: 2.0
risk_pct: 0.008

exits:
  hard_stop: true
  trend_break_ma: 50
  fail_fast_days: 5
  time_stop_days: 0
  take_partial_r: null
  trail_ma: null
  climax_proxy: true

fee_bps: 20
slippage_bps: 5
min_hold_bars: 0
warmup_bars: 300
