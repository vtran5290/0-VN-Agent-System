# Wyckoff thuần: ST + Spring bắt buộc, chỉ LPS (Test of Spring), Cause đủ dài, TR chặt
name: W2_wyckoff_pure
description: "Wyckoff: require ST & Spring, LPS only, Cause 40 bars, tight TR 18%."
logic_gate: Sequential_Event_Validation
setup: wyckoff
require_st: true
require_spring: true
trigger_jac_ok: false
sc_vol_mult: 2.5
sc_spread_atr_mult: 1.8
spring_vol_max_ratio: 0.65
recovery_bars: 5
lps_vol_max_ratio: 0.4
jac_vol_mult: 1.3

constraints:
  min_tr_duration: 40
  max_tr_volatility: 0.18

stop_pct: 0.05
atr_k: 2.0
risk_pct: 0.007

exits:
  hard_stop: true
  trend_break_ma: 50
  fail_fast_days: 3
  climax_proxy: true

fee_bps: 20
slippage_bps: 5
min_hold_bars: 0
warmup_bars: 300
